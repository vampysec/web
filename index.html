<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VampySec | Tools & Análisis Online</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='10' y='80' font-size='80'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #7b2cbf;
            --accent: #ff00cc;
            --dark: #0a0a0a;
            --card: #12121a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(10, 10, 20, 0.97);
            backdrop-filter: blur(16px);
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff00cc, #9d4edd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 26px;
            border-radius: 50px;
            background: rgba(123, 44, 191, 0.15);
            border: 1px solid rgba(123, 44, 191, 0.4);
            color: white;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: 600;
            white-space: nowrap;
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(155, 0, 204, 0.3);
            border-color: var(--accent);
        }

        .main-content {
            padding: 50px 6%;
            max-width: 1480px;
            margin: 0 auto;
        }

        .page { display: none; }
        .page.active-page {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card);
            border: 1px solid #2a1a4a;
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            color: #d86eff;
            margin-bottom: 30px;
            font-size: 1.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .tool-card {
            background: rgba(20, 20, 35, 0.6);
            border: 1px solid #3a2a5a;
            border-radius: 18px;
            padding: 26px;
            transition: all 0.4s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .tool-card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(255, 0, 204, 0.15);
        }

        .tool-name {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .tool-desc {
            flex-grow: 1;
            color: #a0a0c0;
            margin-bottom: 20px;
            font-size: 0.97rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 20px rgba(255, 0, 204, 0.6);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #2a1a4a;
            margin-top: 50px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar { flex-direction: column; padding: 18px 8%; }
            .nav-tabs { justify-content: center; }
            .main-content { padding: 30px 6%; }
            .card { padding: 25px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <span>🦇</span>
        <span>VAMPYSEC</span>
    </div>
    <div class="nav-tabs">
        <div class="nav-btn active" data-page="tools">🔧 TOOLS ONLINE</div>
        <div class="nav-btn" data-page="analysis">🛡️ ANÁLISIS</div>
        <div class="nav-btn" data-page="learning">📚 APRENDIZAJE & CTF</div>
    </div>
</div>

<div class="main-content">

    <!-- TOOLS ONLINE -->
    <div id="tools-page" class="page active-page">
        <div class="card">
            <h2><i class="fas fa-terminal"></i> Herramientas Online Gratuitas</h2>
            <div class="grid" id="tools-grid"></div>
        </div>
    </div>

    <!-- ANÁLISIS -->
    <div id="analysis-page" class="page">
        <div class="card">
            <h2><i class="fas fa-search"></i> Plataformas de Análisis Online</h2>
            <div class="grid" id="analysis-grid"></div>
        </div>
    </div>

    <!-- APRENDIZAJE Y CTF -->
    <div id="learning-page" class="page">
        <div class="card">
            <h2><i class="fas fa-graduation-cap"></i> Aprendizaje y Práctica</h2>
            <div class="grid" id="learning-grid"></div>
        </div>
    </div>

</div>

<footer>
    VampySec — Herramientas Online Gratuitas • Solo para fines educativos y de investigación
</footer>

<script>
// ==================== DATOS ====================
const tools = [
    { name: "Nmap Online", desc: "Escáner de puertos y servicios avanzado", url: "https://pentest-tools.com/network-vulnerability-scanning/port-scanner-online-nmap", icon: "fa-network-wired" },
    { name: "Web Vulnerability Scanner", desc: "Escáner completo de vulnerabilidades web", url: "https://pentest-tools.com/website-vulnerability-scanning/website-scanner", icon: "fa-spider" },
    { name: "SQL Injection Tester", desc: "Pruebas automáticas de SQL Injection", url: "https://pentest-tools.com/website-vulnerability-scanning/sql-injection-scanner-online", icon: "fa-database" },
    { name: "SSL/TLS Tester", desc: "Análisis profesional de certificados SSL", url: "https://www.ssllabs.com/ssltest/", icon: "fa-lock" },
    { name: "DNS Lookup & WHOIS", desc: "Herramientas completas de DNS", url: "https://dnschecker.org/", icon: "fa-globe" },
    { name: "EXIF Metadata", desc: "Visor avanzado de metadatos en imágenes", url: "https://exif.tools/", icon: "fa-image" },
    { name: "Subdomain Enumerator", desc: "Enumeración de subdominios", url: "https://pentest-tools.com/information-gathering/find-subdomains-of-domain", icon: "fa-sitemap" }
];

const analysisTools = [
    { name: "VirusTotal", desc: "Análisis de archivos, URLs y hashes", url: "https://www.virustotal.com/gui/home/upload" },
    { name: "URLScan.io", desc: "Análisis detallado de URLs y phishing", url: "https://urlscan.io/" },
    { name: "Hybrid Analysis", desc: "Sandbox gratuito de malware", url: "https://hybrid-analysis.com/" },
    { name: "Sandbox Policía Nacional", desc: "CSIRT - Policía Nacional de Colombia", url: "https://cc-csirt.policia.gov.co/" },
    { name: "Exploit-DB", desc: "Base de datos pública de exploits", url: "https://www.exploit-db.com/" }
];

const learning = [
    { name: "TryHackMe", desc: "Aprendizaje práctico guiado (recomendado)", url: "https://tryhackme.com/" },
    { name: "Hack The Box", desc: "Retos y máquinas de nivel real", url: "https://www.hackthebox.com/" },
    { name: "Foro ElHacker.net", desc: "Comunidad hispana de ciberseguridad", url: "https://foro.elhacker.net/" }
];

// Render Function
function renderSection(data, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = data.map(item => `
        <div class="tool-card">
            <h3 class="tool-name"><i class="fas ${item.icon}"></i> ${item.name}</h3>
            <p class="tool-desc">${item.desc}</p>
            <a href="${item.url}" target="_blank" class="btn">Acceder →</a>
        </div>
    `).join('');
}

// Navegación
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        
        btn.classList.add('active');
        document.getElementById(btn.dataset.page + '-page').classList.add('active-page');
    });
});

// Inicializar
renderSection(tools, 'tools-grid');
renderSection(analysisTools, 'analysis-grid');
renderSection(learning, 'learning-grid');
</script>
</body>
</html>
